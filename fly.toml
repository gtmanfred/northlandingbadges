# fly.toml app configuration file generated for northlandingbadges on 2026-08-03T13:50:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'northlandingbadges'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  BASE_URL = 'https://north-landing-badges.fly.dev'
  CLUB_TIMEZONE = 'America/New_York'
  DB_PATH = '/data/badges.db'
  EMAIL_FROM_NAME = 'North Landing DGC'
  PORT = '8080'
  SMTP_ADDR = 'smtp.gmail.com:587'

[[mounts]]
  source = 'badges_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
